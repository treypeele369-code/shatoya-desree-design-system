<!-- @dsCard group="Spacing" viewport="700x160" name="Section rhythm" subtitle="Heavy negative space: 80–160px vertical, 24–80px gutters" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--surface-page)}body{margin:0;padding:20px 24px;font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:20px;align-items:baseline}
.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="border:1px solid var(--line-hairline);position:relative;height:110px;display:flex;align-items:center;padding:0 60px">
<div style="position:absolute;left:0;top:0;bottom:0;width:60px;background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--line-accent-soft) 5px,var(--line-accent-soft) 6px)"></div>
<div style="position:absolute;right:0;top:0;bottom:0;width:60px;background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--line-accent-soft) 5px,var(--line-accent-soft) 6px)"></div>
<div><div class="lbl" style="color:var(--text-accent)">--gutter-desktop 80px</div>
<div style="font-family:var(--font-display);font-size:30px;color:var(--text-display);margin-top:6px">Content max 1320px · measure 64ch</div></div></div></body></html>
