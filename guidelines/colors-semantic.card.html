<!-- @dsCard group="Colors" viewport="700x150" name="Semantic aliases" subtitle="Use these, not the raw ramp" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--surface-page)}body{margin:0;padding:20px 24px;font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:20px;align-items:baseline}
.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;background:var(--surface-page);border:1px solid var(--line-hairline);flex:0 0 auto"></span><span class="lbl" style="letter-spacing:.06em;text-transform:none;font-size:11px">--surface-page</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;background:var(--surface-raised);border:1px solid var(--line-hairline);flex:0 0 auto"></span><span class="lbl" style="letter-spacing:.06em;text-transform:none;font-size:11px">--surface-raised</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;background:var(--text-display);border:1px solid var(--line-hairline);flex:0 0 auto"></span><span class="lbl" style="letter-spacing:.06em;text-transform:none;font-size:11px">--text-display</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;background:var(--text-body);border:1px solid var(--line-hairline);flex:0 0 auto"></span><span class="lbl" style="letter-spacing:.06em;text-transform:none;font-size:11px">--text-body</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;background:var(--text-muted);border:1px solid var(--line-hairline);flex:0 0 auto"></span><span class="lbl" style="letter-spacing:.06em;text-transform:none;font-size:11px">--text-muted</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;background:var(--text-accent);border:1px solid var(--line-hairline);flex:0 0 auto"></span><span class="lbl" style="letter-spacing:.06em;text-transform:none;font-size:11px">--text-accent</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;background:var(--line-hairline);border:1px solid var(--line-hairline);flex:0 0 auto"></span><span class="lbl" style="letter-spacing:.06em;text-transform:none;font-size:11px">--line-hairline</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;background:var(--line-accent);border:1px solid var(--line-hairline);flex:0 0 auto"></span><span class="lbl" style="letter-spacing:.06em;text-transform:none;font-size:11px">--line-accent</span></div>
</div></body></html>
