<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--ink-900)}body{margin:0;padding:0;font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:20px;align-items:baseline}
.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="position:relative;height:140px;background:linear-gradient(120deg,#2b211a,#0b0a09 70%);overflow:hidden">
<div style="position:absolute;inset:0;background:var(--vignette)"></div>
<div style="position:absolute;inset:0;background:var(--overlay-hero)"></div>
<div style="position:absolute;inset:0;opacity:var(--grain-opacity);background-image:url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'120\' height=\'120\'><filter id=\'n\'><feTurbulence baseFrequency=\'0.85\' numOctaves=\'3\'/></filter><rect width=\'120\' height=\'120\' filter=\'url(%23n)\'/></svg>')"></div>
<div style="position:absolute;left:24px;bottom:20px"><div class="lbl" style="color:var(--brass-400)">Lawrenceville, Georgia</div>
<div style="font-family:var(--font-display);font-weight:300;font-size:40px;color:var(--bone-50);margin-top:6px">Shatoya Desree</div></div></div></body></html>
