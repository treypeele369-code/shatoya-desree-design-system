<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--surface-page)}body{margin:0;padding:20px 24px;font:var(--type-body);color:var(--text-body)}

.row{display:flex;gap:20px;align-items:baseline}
.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
<div><div class="lbl" style="color:var(--brass-400)">Write</div>

<div><div class="lbl" style="color:var(--bone-500)">Not</div>
<p style="margin-top:12px;font-size:15px;color:var(--bone-500)">&ldquo;Clients MUST cancel 24hrs prior or a fee will be assessed!!&rdquo;</p></div></div></body></html>
