<!-- @dsCard group="Brand" viewport="700x160" name="Interaction states" subtitle="Hover lightens brass; press dims to 88%; focus is a 1px brass ring at 3px offset" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--surface-page)}body{margin:0;padding:20px 24px;font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:20px;align-items:baseline}
.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;height:48px;padding:0 28px;background:var(--brass-500);color:var(--ink-900);font-family:var(--font-ui);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:2px">Rest</span>
<span style="display:inline-flex;align-items:center;height:48px;padding:0 28px;background:var(--brass-400);color:var(--ink-900);font-family:var(--font-ui);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:2px">Hover</span>
<span style="display:inline-flex;align-items:center;height:48px;padding:0 28px;background:var(--brass-500);opacity:.88;color:var(--ink-900);font-family:var(--font-ui);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:2px">Press</span>
<span style="display:inline-flex;align-items:center;height:48px;padding:0 28px;background:var(--brass-500);color:var(--ink-900);font-family:var(--font-ui);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:2px;outline:1px solid var(--brass-400);outline-offset:3px">Focus</span>
<span style="display:inline-flex;align-items:center;height:48px;padding:0 28px;background:var(--brass-500);opacity:.38;color:var(--ink-900);font-family:var(--font-ui);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:2px">Disabled</span>
</div></body></html>
