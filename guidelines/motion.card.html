<!-- @dsCard group="Brand" viewport="700x160" name="Motion — fade and rise" subtitle="900ms reveal, 24px rise, no bounce" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--surface-page)}body{margin:0;padding:20px 24px;font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:20px;align-items:baseline}
.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><style>@keyframes rise{0%{opacity:0;transform:translateY(24px)}60%,100%{opacity:1;transform:none}}
.r{animation:rise 2.6s var(--ease-out-soft) infinite}</style>
<div style="display:flex;gap:28px;align-items:center">
<div class="r" style="font-family:var(--font-display);font-size:34px;color:var(--text-display)">Fade and rise</div>
<div class="r" style="animation-delay:.15s;width:120px;height:1px;background:var(--line-accent)"></div>
</div>
<div class="lbl" style="margin-top:22px">--dur-reveal 900ms · --ease-out-soft cubic-bezier(.16,1,.3,1) · --rise-distance 24px</div></body></html>
