<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & rules" subtitle="Near-square. Circle is reserved for the logo badge." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{background:var(--surface-page)}body{margin:0;padding:20px 24px;font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:20px;align-items:baseline}
.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:flex;gap:24px;align-items:center">
<div style="text-align:center"><div style="width:56px;height:56px;border:1px solid var(--line-accent);border-radius:var(--radius-none)"></div><div class="lbl" style="margin-top:8px;font-size:9px;letter-spacing:.08em">0px</div></div><div style="text-align:center"><div style="width:56px;height:56px;border:1px solid var(--line-accent);border-radius:var(--radius-xs)"></div><div class="lbl" style="margin-top:8px;font-size:9px;letter-spacing:.08em">1px</div></div><div style="text-align:center"><div style="width:56px;height:56px;border:1px solid var(--line-accent);border-radius:var(--radius-sm)"></div><div class="lbl" style="margin-top:8px;font-size:9px;letter-spacing:.08em">2px</div></div><div style="text-align:center"><div style="width:56px;height:56px;border:1px solid var(--line-accent);border-radius:var(--radius-md)"></div><div class="lbl" style="margin-top:8px;font-size:9px;letter-spacing:.08em">3px</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;border:1px solid var(--line-accent);border-radius:999px"></div><div class="lbl" style="margin-top:8px;font-size:9px;letter-spacing:.08em">badge only</div></div>
<div style="flex:1;display:grid;gap:12px"><div style="height:1px;background:var(--line-hairline)"></div><div style="height:1px;background:var(--line-accent-soft)"></div><div style="height:1px;background:var(--line-accent)"></div></div>
</div></body></html>
