<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px}
body{display:grid;grid-template-columns:1fr 320px;background:var(--ink-900)}
.main{display:flex;align-items:center;justify-content:center;background:var(--ink-900)}
.mark{width:620px;height:620px;border-radius:999px}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip div{width:100%;height:100%}</style></head><body>
<div class="main"><img class="mark" src="assets/logo-badge.jpg" alt="Shatoya Desree LLC monogram"></div>
<div class="strip"><div style="background:var(--bone-100)"></div><div style="background:var(--brass-400)"></div><div style="background:var(--brass-500)"></div><div style="background:var(--oxblood-700)"></div></div>
</body></html>
